[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riklr-vendor-payments"
version = "0.1.0"
description = "Riklr AI FDE case study: vendor-payments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app", "backtest"]

[tool.ruff]
target-version = "py311"
line-length = 100
