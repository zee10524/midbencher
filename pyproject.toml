[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riklr-vendor-payments"
version = "0.1.0"
description = "Riklr AI FDE case study: vendor-payments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    # the reader (app/reader)
    "pymupdf>=1.24",      # render or extract the page images of the image-only PDFs
    "pytesseract>=0.3.10",  # Python wrapper for the Tesseract OCR program (see README, System requirement)
    "pdfplumber>=0.11",   # fast path only: text of a PDF that does have a text layer (none in the pack does)
    "pillow>=10",         # open and prepare the photos and page images
    "numpy>=1.26",        # image arrays; also pulled in by pandas
    "anthropic>=0.40",    # vision model that reads the bill fields (needs an API key)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app", "backtest"]

[tool.ruff]
target-version = "py311"
line-length = 100
